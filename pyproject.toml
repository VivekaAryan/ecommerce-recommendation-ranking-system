[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recsys"
version = "0.1.0"
description = "Production-grade ecommerce recommendation and ranking platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2.0",
    "faiss-cpu>=1.8.0",
    "lightgbm>=4.3.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "sentence-transformers>=2.6.0",
    "mlflow>=2.12.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "matplotlib>=3.8.0",
    "datasets>=2.18.0",
    "huggingface-hub>=0.21.0",
    "tqdm>=4.66.0",
    "shap>=0.45.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "ruff>=0.3.0",
    "pre-commit>=3.6.0",
]
serving = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
]

[project.scripts]
recsys-download = "recsys.cli:download_data"
recsys-build-features = "recsys.cli:build_features"
recsys-train-retrieval = "recsys.cli:train_retrieval"
recsys-train-ranker = "recsys.cli:train_ranker"
recsys-run-simulator = "recsys.cli:run_simulator"
recsys-evaluate = "recsys.cli:evaluate"
recsys-ui = "recsys.api.server:main"

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["recsys"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
