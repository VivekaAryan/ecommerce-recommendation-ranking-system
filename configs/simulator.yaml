environment:
  num_users: 1000
  default_inventory: 100
  attention_decay_rate: 0.01
  num_synthetic_users: 200

policy:
  slate_size: 10
  position_bias: [1.0, 0.7, 0.5, 0.35, 0.25, 0.18, 0.12, 0.08, 0.05, 0.03]
  click_temperature: 1.0
  purchase_given_click_prob: 0.15

simulation:
  num_days: 7
  sessions_per_day: 500
  policy_id: baseline_v0

reranking:
  calibration_method: isotonic
  mmr_lambda: 0.7
  exploration:
    method: epsilon_greedy
    epsilon: 0.1
    explore_positions: [8, 9]

latency_budget_ms:
  retrieval: 20
  prerank: 10
  ranking: 50
  reranking: 30
  total: 100
