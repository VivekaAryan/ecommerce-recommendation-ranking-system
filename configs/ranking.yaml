sequential:
  hidden_dim: 128
  num_layers: 2
  num_heads: 4
  max_seq_length: 50
  dropout: 0.1

multitask:
  head_weights:
    click: 0.35
    purchase: 0.30
    expected_value: 0.25
    engagement: 0.10

training:
  batch_size: 256
  learning_rate: 0.0005
  epochs: 15

prerank:
  top_k: 100
  score_features:
    - retrieval_score
    - popularity_decay_7d
    - price_bucket

lgbm:
  objective: lambdarank
  metric: ndcg
  num_leaves: 63
  learning_rate: 0.05
  n_estimators: 200
  label_gain: [0, 1, 3, 7, 15]
